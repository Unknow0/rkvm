[package]
name = "rkvm-client"
license = "MIT"
version = "0.6.1"
authors = ["Jan Trefil <8711792+htrefil@users.noreply.github.com>"]
edition = "2021"

[[bin]]
name = "rkvm-service"
path = "src/windows-service.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.0.1", features = ["macros", "time", "fs", "net", "signal", "rt-multi-thread", "sync"] }
rkvm-input = { path = "../rkvm-input" }
rkvm-net = { path = "../rkvm-net" }
serde = { version = "1.0.117", features = ["derive"] }
toml = "0.5.7"
env_logger = "0.8.1"
clap = { version = "4.2.2", features = ["derive"] }
thiserror = "1.0.40"
tokio-rustls = "0.24.0"
rustls-pemfile = "1.0.2"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
bincode = "1.3.3"
windows = { version = "0.62", features = [
	"Win32_System_RemoteDesktop",
    "Win32_Foundation",
	"Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Environment",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [ "Win32" ]}
windows-service = "0.8"

[package.metadata.rpm]
package = "rkvm-client"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
client = { path = "/usr/bin/rkvm-client" }
